# Backend host, Nginx http context. Allow only the frontend's actual source IP.
# Set web.serve_static=false. Use a certificate for the backend DNS name.
server {
	listen 443 ssl;
	server_name hoodmin-backend.example.com;
	ssl_certificate /etc/letsencrypt/live/hoodmin-backend.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/hoodmin-backend.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	server_tokens off;
	client_max_body_size 1m;
	allow 192.0.2.10;
	deny all;
	location ~ ^/(api(/|$)|s/|f/|healthz$|readyz$) {
		proxy_pass http://127.0.0.1:3080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto https;
		# Trusted only because source access above is restricted to the frontend.
		# The frontend must overwrite this header with its own $remote_addr.
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_real_ip;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_read_timeout 3600s;
	}
	location / { return 404; }
}
