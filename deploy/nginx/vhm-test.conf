# VPS: /etc/nginx/conf.d/vhm-test.conf
# Bu dosya nginx.conf içindeki http bağlamından yüklenmelidir.
server {
	listen 80;
	server_name vhm-test.oktayaktogan.com.tr;
	return 308 https://vhm-test.oktayaktogan.com.tr$request_uri;
}

server {
	listen 443 ssl;
	server_name vhm-test.oktayaktogan.com.tr;

	ssl_certificate /usr/local/share/certificates/oktayaktogan.com.tr/fullchain.pem;
	ssl_certificate_key /usr/local/share/certificates/oktayaktogan.com.tr/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	client_max_body_size 512k;

	location / {
		proxy_pass https://46.196.34.83:40443;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host vhm-test.oktayaktogan.com.tr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Host vhm-test.oktayaktogan.com.tr;
		proxy_set_header X-Forwarded-Port 443;

		# SNI ve doğrulama adı arka uç sertifikasındaki DNS kaydıdır.
		proxy_ssl_server_name on;
		proxy_ssl_name yapayzeka;
		proxy_ssl_verify on;
		proxy_ssl_verify_depth 2;
		proxy_ssl_trusted_certificate /etc/nginx/vhm-test-ca.crt;
		proxy_ssl_protocols TLSv1.2 TLSv1.3;

		# Canlı sayaçların sunucu olayları (SSE) tamponlanmasın.
		proxy_buffering off;
		proxy_cache off;
		proxy_connect_timeout 10s;
		proxy_send_timeout 60s;
		proxy_read_timeout 1h;
		proxy_next_upstream off;
		proxy_redirect off;
	}
}
