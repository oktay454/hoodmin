# Separate frontend host: copy the complete /usr/share/hoodmin/web tree here.
# Load from the Nginx http context. Replace example names and certificate paths.
server {
	listen 80;
	server_name hoodmin.example.com;
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		try_files $uri =404;
	}
	location / { return 301 https://hoodmin.example.com$request_uri; }
}
server {
	listen 443 ssl;
	server_name hoodmin.example.com;
	ssl_certificate /etc/letsencrypt/live/hoodmin.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/hoodmin.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:HoodminTLS:10m;
	ssl_session_timeout 1d;
	server_tokens off;
	client_max_body_size 1m;
	add_header Strict-Transport-Security "max-age=86400" always;
	add_header Cache-Control "no-store" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "same-origin" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	location ~ ^/(api(/|$)|s/|f/|healthz$|readyz$) {
		proxy_pass https://hoodmin-backend.example.com;
		proxy_ssl_server_name on;
		proxy_ssl_name hoodmin-backend.example.com;
		proxy_ssl_verify on;
		proxy_ssl_verify_depth 3;
		proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_hide_header Cache-Control;
		proxy_hide_header X-Content-Type-Options;
		proxy_hide_header Referrer-Policy;
		proxy_hide_header Content-Security-Policy;
		proxy_hide_header Permissions-Policy;
	}
	root /usr/share/hoodmin/web;
	location ^~ /assets/ {
		try_files $uri =404;
	}
	location = / {
		try_files /index.html =503;
	}
	location ~ ^/(signin|servers|access-keys|sessions|users|audit|account|farms|profiles|server-profiles|bots|notifications|integrations|reports)/?$ {
		try_files /index.html =503;
	}
	location ~ "^/(servers/[0-9a-fA-F-]{36}/(configuration|routing|certificates|autosign|installation|credential)|farms/[0-9a-fA-F-]{36}/(server-profile|certificates|destinations))/?$" {
		try_files /index.html =503;
	}
	location / { return 404; }
}
