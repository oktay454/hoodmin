# Built-in static serving. Replace the example name and certificate paths.
server {
	listen 80;
	server_name hoodmin.example.com;
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		try_files $uri =404;
	}
	location / {
		return 301 https://hoodmin.example.com$request_uri;
	}
}
server {
	listen 443 ssl;
	server_name hoodmin.example.com;
	ssl_certificate /etc/letsencrypt/live/hoodmin.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/hoodmin.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:HoodminTLS:10m;
	ssl_session_timeout 1d;
	server_tokens off;
	client_max_body_size 1m;
	add_header Strict-Transport-Security "max-age=86400" always;
	location / {
		proxy_pass http://127.0.0.1:3080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_read_timeout 3600s;
	}
}
