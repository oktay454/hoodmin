[package]
name = "hoodmin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "hoodmin"
path = "src/main.rs"

[[bin]]
name = "hoodmin-cli"
path = "src/cli_main.rs"

[dependencies]
vpnhood-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "time", "process", "io-util"] }
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-native-tls"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["uuid", "chrono", "json"] }
clap = { version = "4", features = ["derive", "env"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

leptos = { version = "=0.8.22", default-features = false, features = ["ssr"] }
argon2 = "0.5"
openssl = "0.10"
futures-util = "0.3"
tokio-stream = "0.1"

url = "=2.5.8"

reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
percent-encoding = "2"
tower = { version = "0.5", features = ["util"] }
