[workspace]
resolver = "3"
members = ["crates/protocol", "crates/manager", "crates/paste-compat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[patch.crates-io]
paste = { path = "crates/paste-compat" }
